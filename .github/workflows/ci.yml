name: Flutter CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      webui_ref:
        description: 'hermes-webui git ref (branch, tag, or commit sha)'
        required: false
        default: ''
      update_goldens:
        description: "true = 以本 runner 平台重生成金照基线并上传 artifact（用于补某平台基线）"
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 改动集闸门：文档-only 提交（.todo/、docs/、*.md、sketches/）不该跑 android 501s
  # + windows 375s 的构建——main 上一天可达 41 次 push，其中大量是收口/文档提交。
  # 判定用**白名单**而非 paths-ignore 黑名单：夹带代码改动的「文档提交」必须照样跑，
  # 黑名单会把它们静默放过去（那比慢更危险）。
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Compute changed paths
        shell: bash
        run: |
          set -uo pipefail
          code=true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            # 手动触发 = 发布/验收，要全量；tag 推送尤其不能按 diff 判定——tag 的
            # event.before 是它之前的那个提交，若那提交恰好只动文档就会把安装包跳过。
            echo "workflow_dispatch / tag → 一律视为代码改动（发布要出安装包）"
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
            fi
            # 新分支/新 tag 的 before 是全 0，force-push 或浅克隆也可能取不到 base。
            # 这几种情况**不能**退化成「只看最后一个提交」——那会让「分支 tip 是文档
            # 提交、底下压着代码提交」被误判成纯文档，重活被静默跳过。取不到基准就
            # 保守视为代码改动。
            if [ -z "$base" ] \
               || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "取不到比对基准（新分支/新 tag/浅克隆/force-push）→ 保守视为代码改动"
            elif ! changed=$(git diff --name-only --diff-filter=ACMR "$base" "$head" 2>/dev/null); then
              echo "git diff 失败 → 保守视为代码改动"
            else
              echo "改动文件（$base..$head）："
              printf '%s\n' "$changed"
              if [ -z "$changed" ]; then
                code=false
                echo "无文件变化 → 跳过重活"
              elif printf '%s\n' "$changed" | grep -Eq '^(lib/|test/|android/|ios/|linux/|macos/|web/|windows/|third_party/|tools/|scripts/|assets/|pubspec\.(yaml|lock)|analysis_options\.yaml|\.github/)'; then
                code=true
                echo "命中代码路径 → 重活照跑"
              else
                code=false
                echo "改动仅命中非代码路径 → 跳过重活（guard/fake-gateway 仍会跑）"
              fi
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # 秒级护栏（永远跑，不被 changes 闸门跳过）：tools 脚本可编译 + 版本号两处不漂移。
  # 拆出来的理由：这两项各 <5s，此前只能挂在 6 分钟的 analyze-test 后面，而
  # analyze-test 在文档提交上会被闸门跳过——那正是漂移最容易漏掉的场景
  # （v0.1.51 bump 把 CI 打红一次，见 .todo/active.md #131）。
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: tools/ 脚本可编译
        run: python -m py_compile $(git ls-files 'tools/*.py' 'tools/**/*.py')
      - name: 版本号两处一致（pubspec.yaml ⇄ appVersion）
        run: python tools/bump_version.py --check

  analyze-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - run: flutter analyze
      # 金照基线按平台分目录（test/golden/goldens/<windows|linux|macos>/）：金照是
      # 渲染环境的产物，各平台只与自己那份比；本 runner 缺基线时用例自动 skip 而非
      # 失败（见 test/golden/golden_platform.dart）。update_goldens=true 时改为以本
      # runner 平台重生成基线并上传 artifact，用于补齐 Linux 基线。
      - name: Run tests
        run: |
          if [ "${{ github.event.inputs.update_goldens }}" = "true" ]; then
            flutter test --update-goldens test/golden/
          else
            flutter test
          fi
      - name: Upload regenerated goldens
        if: github.event.inputs.update_goldens == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: goldens-${{ runner.os }}
          path: test/golden/goldens/
          if-no-files-found: warn
      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ runner.os }}
          path: test/golden/failures/
          if-no-files-found: ignore

  # 刻意不依赖 analyze-test：测试红不该连坐掉「包能不能构建」的验证。
  # 这两者原为 needs: analyze-test，令历史 129 次 run 从未真正执行过一次。
  android-debug:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      # 停维护的 super_clipboard 家族在 AGP 8+/Gradle 9 下有两处硬伤（缺 namespace、
      # CargoKit 用已移除的 childProjects），干净 pub-cache 必然构建失败。本机长期靠
      # 仓库外手改 pub-cache 绕过；此处收敛为入仓幂等步骤（细节见脚本模块文档）。
      - run: python3 tools/patch_android_pub_cache.py
      - run: flutter build apk --debug
      # #119 拼包护栏：cargokit 插件（super_native_extensions）的 .so 必须真的进 APK。
      # 没进包时构建不报错，而是让该插件注册期抛 Error、把 GeneratedPluginRegistrant
      # 从中间截断（其后 url_launcher/wakelock_plus/workmanager 静默失联，应用还不闪退），
      # 2026-09-14 整整查了一轮才发现这层连坐——故把「产物在不在」固化成硬失败。
      - run: python3 tools/verify_apk_native_libs.py build/app/outputs/flutter-apk/app-debug.apk

  fake-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/fake_gateway/requirements.txt
      # smoke_test.py 可从任意 cwd 调用（内部按 __file__ 解析 main.py）；
      # 子进程输出在失败时回显，避免「未就绪」类报错无根因可查。
      - run: python tools/fake_gateway/smoke_test.py

  # Windows 侧的两件事（#133）：
  #  1) main 每次 push 都要构建（否则 Windows-only 编译断裂要到发版才发现），但
  #     Inno 打包 + webui bundle 克隆只在 tag/dispatch 上做——发布用的安装包一直是
  #     本地打的，CI 那份是给「能不能打出来」兜底，不是发布产物。
  #  2) 构建后**必须启动一次产物**：CI 以前只 build 不跑，于是 #119 那类
  #     「构建绿、装上崩」在流水线上完全不可见。
  windows-installer:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Flutter build windows
        run: |
          flutter pub get
          flutter build windows --release

      # 判据刻意不用「存活 N 秒」：本机已装版在跑时，新实例会 1s 内干净退出
      # （单实例保护，exit 0），那不是崩溃——详见 tools/smoke_windows_exe.py 头部。
      - name: Smoke test built exe
        run: python tools/smoke_windows_exe.py build/windows/x64/runner/Release/hermes_ui.exe --strict

      - name: Install Inno Setup
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # Primary: choco install innosetup. Alternative: choco install jrsoftware.iscc
          choco install innosetup --no-progress -y
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6") {
            "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii
          }

      - name: Assemble WebUI sidecar bundle
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $webuiRef = "${{ github.event.inputs.webui_ref }}"
          if ($webuiRef) {
            powershell -ExecutionPolicy Bypass -File scripts/packaging/build_webui_bundle.ps1 -WebuiRef $webuiRef
          } else {
            powershell -ExecutionPolicy Bypass -File scripts/packaging/build_webui_bundle.ps1
          }

      - name: Compile Inno Setup installer
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/packaging/build_installer.ps1

      - name: Upload Windows Installer Artifact
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ui-windows-setup
          path: build/installer/*.exe
          if-no-files-found: error
