name: mermaid_flutter
description: >-
  Native Flutter renderer for mermaid_core: TextPainter text measurement and a
  CustomPainter that paints the mermaid render scene directly. 28 diagram types.
version: 0.3.0
repository: https://github.com/orestesgaolin/mermaid
issue_tracker: https://github.com/orestesgaolin/mermaid/issues
topics:
  - mermaid
  - diagram
  - flutter
  - visualization
environment:
  sdk: ^3.12.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  mermaid_core: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
